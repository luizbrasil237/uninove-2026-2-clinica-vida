<!doctype html>
<html lang="pt-BR">
<head>
   <link rel="stylesheet" href="assets/css/site.css">
  <meta charset="UTF-8">    
  <title>Clínica Vida+</title>
 
</head>
<body>
 <header>
    <h1>Clínica Vida+</h1>
    <p>Agendamento de consultas em seis especialidades.</p>
  </header>
<form class="form-agendamento" action="/agendamento" method="post">
  <fieldset>
    <legend>Dados do paciente</legend>
    <div class="form-grid">
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" minlength="5" required>
      </div>
      <div class="campo">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf"
               placeholder="000.000.000-00"
               pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" required>
      </div>
      <div class="campo">
        <label for="nascimento">Data de nascimento</label>
        <input type="date" id="nascimento" name="nascimento" required>
      </div>
      <div class="campo">
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" required>
      </div>
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>
      </div>
    </div>
  </fieldset>

  <footer>
  <p>Rua das Acácias, 120, São Paulo. Telefone: (11) 4002-8922</p>
</footer>
</body>
</html>
